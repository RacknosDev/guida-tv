name: Aggiorna guida TV


on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Prendi il mio deposito
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica il raccoglitore
        run: git clone --depth 1 https://github.com/iptv-org/epg.git raccoglitore

      - name: Installa quello che serve
        working-directory: raccoglitore
        run: npm install

      - name: Raccogli il palinsesto completo
        working-directory: raccoglitore
        run: npm run grab -- --channels=../italia.channels.xml --output=../guida.xml --maxConnections=5 --days=3

      - name: Controlla che il palinsesto non sia vuoto
        run: |
          if [ ! -s guida.xml ]; then
            echo "Il palinsesto e' vuoto: la raccolta non ha funzionato."
            exit 1
          fi
          echo "Programmi raccolti: $(grep -c '<programme' guida.xml)"



      - name: Tieni solo film e serie
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 filtra.py

      - name: Salva il risultato
        run: |
          git config user.name "guida-tv"
          git config user.email "guida-tv@users.noreply.github.com"

          rm -f guida.xml
          git add guida-film-serie.json cache-titoli.json
          git diff --staged --quiet || git commit -m "Guida aggiornata"
          git push
